<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SteamZero — Receptor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,sans-serif;overflow:hidden;width:100vw;height:100vh}
#video{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:10;text-align:center;padding:24px}
#overlay.hidden{display:none}
#overlay h2{font-size:24px;margin-bottom:12px}
#overlay p{font-size:16px;color:#9eabba;margin-bottom:24px;max-width:480px}
#status-text{font-size:18px;color:#13bdf2;margin-bottom:8px}
#status-detail{font-size:14px;color:#9eabba}
#stop-btn{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#ff6b73;color:#fff;border:none;border-radius:8px;padding:14px 32px;font-size:18px;cursor:pointer;z-index:20;min-width:200px;min-height:48px}
#stop-btn:focus{outline:2px solid #13bdf2;outline-offset:4px}
#stop-btn:hover{background:#ff8a90}
.quality-badge{position:fixed;top:16px;right:16px;background:rgba(0,0,0,.7);color:#9eabba;padding:6px 12px;border-radius:6px;font-size:12px;z-index:15}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="overlay">
<h2 id="status-text">Conectando...</h2>
<p id="status-detail">Aguardando sinal de transmissão</p>
</div>
<div id="quality-badge" class="quality-badge hidden"></div>
<button id="stop-btn">Encerrar transmissão</button>
<script>
(function() {
    'use strict';
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('status-text');
    const statusDetail = document.getElementById('status-detail');
    const qualityBadge = document.getElementById('quality-badge');
    const stopBtn = document.getElementById('stop-btn');

    let pc = null;
    let eventSource = null;
    let reconnectTimer = null;

    function setStatus(text, detail) {
        statusText.textContent = text;
        statusDetail.textContent = detail || '';
        overlay.classList.remove('hidden');
    }

    function setConnected() {
        overlay.classList.add('hidden');
    }

    function setQuality(label) {
        qualityBadge.textContent = label;
        qualityBadge.classList.remove('hidden');
    }

    function signalPost(data) {
        fetch('/signal', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).catch(function(e) {
            console.error('signal post error:', e);
        });
    }

    function connect() {
        eventSource = new EventSource('/signal');
        eventSource.addEventListener('offer', function(e) {
            try {
                var msg = JSON.parse(e.data);
                handleOffer(msg);
            } catch(err) {
                console.error('offer parse error:', err);
            }
        });
        eventSource.addEventListener('candidate', function(e) {
            try {
                var msg = JSON.parse(e.data);
                if (pc && msg.candidate) {
                    pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(function(err) {
                        console.error('ICE candidate error:', err);
                    });
                }
            } catch(err) {
                console.error('candidate parse error:', err);
            }
        });
        eventSource.addEventListener('error', function(e) {
            setStatus('Erro', e.data || 'Erro desconhecido');
        });
        eventSource.onerror = function() {
            setStatus('Reconectando...', 'Conexão perdida');
            scheduleReconnect();
        };
        eventSource.onopen = function() {
            setStatus('Conectando...', 'Sinal estabelecido, aguardando oferta');
        };
    }

    function handleOffer(msg) {
        if (!pc) {
            pc = new RTCPeerConnection({
                iceServers: []
            });
            pc.ontrack = function(event) {
                if (event.track.kind === 'video') {
                    video.srcObject = event.streams[0];
                    setConnected();
                }
            };
            pc.oniceconnectionstatechange = function() {
                switch (pc.iceConnectionState) {
                    case 'connected':
                    case 'completed':
                        setConnected();
                        break;
                    case 'disconnected':
                        setStatus('Reconectando...', 'Conexão de rede instável');
                        break;
                    case 'failed':
                        setStatus('Falha na conexão', 'A transmissão foi interrompida');
                        break;
                    case 'closed':
                        setStatus('Encerrado', 'A transmissão foi encerrada');
                        break;
                }
            };
            pc.onicecandidate = function(e) {
                if (e.candidate) {
                    signalPost({type: 'candidate', candidate: e.candidate.toJSON()});
                }
            };
        }
        pc.setRemoteDescription(new RTCSessionDescription({type: 'offer', sdp: msg.sdp})).then(function() {
            return pc.createAnswer();
        }).then(function(answer) {
            return pc.setLocalDescription(answer);
        }).then(function() {
            signalPost({type: 'answer', sdp: pc.localDescription.sdp});
        }).catch(function(e) {
            console.error('offer handling error:', e);
            setStatus('Erro', 'Falha ao processar oferta');
        });
    }

    function scheduleReconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        reconnectTimer = setTimeout(function() {
            if (pc) {
                pc.close();
                pc = null;
            }
            connect();
        }, 3000);
    }

    stopBtn.addEventListener('click', function() {
        signalPost({type: 'stop'});
        if (pc) {
            pc.close();
            pc = null;
        }
        setStatus('Encerrado', 'Transmissão encerrada pelo usuário');
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.key === 'q') {
            stopBtn.click();
        }
    });

    connect();
})();
</script>
</body>
</html>
