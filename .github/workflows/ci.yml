# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout limpo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependências verificadas por hash
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Checkout sem alterações prévias
        run: test -z "$(git status --porcelain)"
      - name: Formatação
        run: ruff format --check src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Fronteiras arquiteturais
        run: python tools/lint_boundaries.py --root src
      - name: Independência do PhaseZero
        run: python tools/check_independence.py
      - name: Tipos estritos
        run: mypy
      - name: Runtime QML para os harnesses offscreen
        # Os harnesses provam o que teste Python não alcança: que o artwork de
        # emulação chega a Image.Ready — a lacuna que deixou "os ícones sumiram"
        # passar por gates verdes na a37 — e que a shell carrega sem warning.
        #
        # Best-effort de propósito: `test_qml_handheld_offscreen.py` já pula por
        # skipif quando qml6 está ausente, e um runtime opcional não deve
        # derrubar o job. Se a provisão falhar, o passo registra o diagnóstico e
        # segue; a cobertura não depende destes testes.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libgl1 libegl1 || echo "provisão do runtime QML falhou"
          echo "--- binários Qt encontrados ---"
          find /usr/lib/qt6/bin /usr/bin -maxdepth 1 -name 'qml*' 2>/dev/null || true
          runner=$(command -v qml6 || find /usr/lib/qt6/bin -maxdepth 1 -name qml -type f 2>/dev/null | head -1)
          if [ -n "$runner" ]; then
            dir=$(dirname "$runner")
            [ -x "$dir/qml6" ] || sudo ln -sf "$runner" "$dir/qml6"
            echo "$dir" >> "$GITHUB_PATH"
            echo "runtime QML disponível em $dir"
          else
            echo "qml6 indisponível; os harnesses serão pulados por skipif"
          fi
      - name: Testes e cobertura
        run: |
          mkdir -p build
          pytest \
            -m "not visual" \
            --cov=steamzero \
            --cov-report=term-missing \
            --cov-report=xml:build/coverage-${{ matrix.python-version }}.xml \
            --cov-report=json:build/coverage-${{ matrix.python-version }}.json
      - name: Publicar cobertura
        # always(): quando a cobertura reprova, o relatório é justamente o que
        # se precisa para descobrir POR QUE. Publicar só no sucesso esconde o
        # dado no único momento em que ele importa.
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.14
          path: build/coverage-3.14.*
          if-no-files-found: error
          retention-days: 30

  package:
    name: Wheel limpo, smoke e supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout limpo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Dependências verificadas por hash
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verificar checkout e construir wheel isolado
        run: |
          test -z "$(git status --porcelain)"
          mkdir -p build
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/release_provenance.py verify-wheel --wheel dist/*.whl
      - name: Instalar wheel em ambiente vazio e executar smoke
        run: |
          python -m venv /tmp/steamzero-smoke
          /tmp/steamzero-smoke/bin/python -m pip install --require-hashes -r requirements-runtime.lock
          /tmp/steamzero-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/steamzero-smoke/bin/python -m pip check
          /tmp/steamzero-smoke/bin/steamzero --version
          /tmp/steamzero-smoke/bin/steamzero doctor --json
          /tmp/steamzero-smoke/bin/python -c "from steamzero import ports; assert ports.DevicePort"
      - name: Auditar ambiente instalado pelo feed OSV e gerar SBOM
        run: |
          site_packages=$(/tmp/steamzero-smoke/bin/python -c "import site; print(site.getsitepackages()[0])")
          pip-audit --path "$site_packages" --vulnerability-service osv --progress-spinner off --format json --output build/pip-audit.json
          pip-audit --path "$site_packages" --vulnerability-service osv --progress-spinner off --format cyclonedx-json --output build/sbom.cdx.json
      - name: Gerar proveniência local e checksums
        run: |
          python tools/release_provenance.py create \
            --wheel dist/*.whl \
            --sbom build/sbom.cdx.json \
            --commit "$(git rev-parse HEAD)" \
            --repository "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --run-id "${{ github.run_id }}" \
            --output build/provenance.json
          sha256sum dist/*.whl build/sbom.cdx.json build/provenance.json > build/SHA256SUMS
      - name: Atestar proveniência assinada em tags
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          (github.event.repository.visibility == 'public' ||
          vars.STEAMZERO_ENABLE_GITHUB_ATTESTATION == 'true')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl
      - name: Atestar SBOM assinada em tags
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          (github.event.repository.visibility == 'public' ||
          vars.STEAMZERO_ENABLE_GITHUB_ATTESTATION == 'true')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl
          sbom-path: build/sbom.cdx.json
      - name: Wheelhouse de runtime com manifesto
        # Produzido pelo CI, de checkout limpo, com hash verificado. O
        # instalador do host consome EXATAMENTE este conjunto — nunca um
        # diretório local de origem desconhecida.
        run: |
          python tools/build_wheelhouse.py \
            --out dist/runtime-wheelhouse \
            --wheel "$(ls dist/steamzero-*.whl | head -1)"
          python tools/build_wheelhouse.py --out dist/runtime-wheelhouse --validate-only
          tar --zstd -cf dist/runtime-wheelhouse.tar.zst -C dist runtime-wheelhouse
          sha256sum dist/runtime-wheelhouse.tar.zst \
            dist/runtime-wheelhouse/WHEELHOUSE-MANIFEST.json | tee -a build/SHA256SUMS
      - name: Publicar wheel, auditoria, SBOM e proveniência
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steamzero-wheel-${{ github.sha }}
          path: |
            dist/runtime-wheelhouse.tar.zst
            dist/runtime-wheelhouse/WHEELHOUSE-MANIFEST.json
            requirements-runtime.lock
            dist/*.whl
            build/pip-audit.json
            build/sbom.cdx.json
            build/provenance.json
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  distro-smoke:
    name: Smoke ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          - name: Arch Linux
            image: archlinux@sha256:212b1e518e94ee9c52be55e8a32da75fcf11e7b5610b80b49479e67880102406
          - name: Manjaro
            image: manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout limpo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bibliotecas de runtime da distribuição
        # A imagem base do Ubuntu não traz libsqlite3, e o Python portátil do
        # setup-python liga dinamicamente contra ela: sem isto o smoke falha em
        # "import sqlite3" com libsqlite3.so.0 ausente. Arch e Manjaro já a
        # incluem na base, por isso só o Ubuntu reprovava.
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends libsqlite3-0 ca-certificates
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --needed sqlite ca-certificates
          fi
      - name: Python 3.14 portátil
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Identificar distribuição
        run: cat /etc/os-release
      - name: Construir e instalar sem editable
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv /tmp/steamzero-distro
          /tmp/steamzero-distro/bin/python -m pip install --require-hashes -r requirements-runtime.lock
          /tmp/steamzero-distro/bin/python -m pip install --no-deps dist/*.whl
          /tmp/steamzero-distro/bin/python -m pip check
          /tmp/steamzero-distro/bin/steamzero --version
          /tmp/steamzero-distro/bin/steamzero doctor --json

  qml-visual-linux:
    # Gate visual. Nasce SEM `continue-on-error`, e a diferença não é estilo.
    #
    # Roda dentro da imagem CANÔNICA, fixada por digest. O ambiente é o
    # contrato: as baselines não comparam "o texto renderizado", comparam pixels
    # produzidos por uma combinação exata de Qt, FreeType, HarfBuzz e fontconfig.
    #
    # O runner do Ubuntu não serve, e foi verificado no CI: `/usr/lib/qt6/bin/`
    # traz qmldom, qmllint, qmltestrunner e mais nove binários, e NENHUM `qml`.
    # A provisão de Qt aqui nunca funcionou — o `skipif` dos harnesses legados
    # escondeu isso desde sempre. E mesmo que servisse, o Ubuntu 24.04 traz Qt
    # 6.4.2 enquanto as baselines vieram de 6.11.1.
    name: Gate visual QML (Linux)
    runs-on: ubuntu-latest
    container:
      # Digest, nunca tag. Tag é mutável, e a autoridade do gate é o digest.
      # Publicado por `.github/workflows/qml-visual-image.yml`.
      image: ghcr.io/misael-art/steamzero-qml-visual@sha256:8e87d2c009e3b640844faabbc027263898f588f0c4478c0e0dc871d55e1ee5ac
    steps:
      - name: Checkout limpo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Conferir o ambiente contra o lock
        # ANTES de renderizar. Descobrir a divergência depois faria diferença de
        # AMBIENTE aparecer como diferença de pixel, e quem investiga procuraria
        # defeito no código.
        run: |
          cat /opt/steamzero-visual/environment.txt
          python - <<'CHECK'
          import json, pathlib, sys
          lock = json.loads(pathlib.Path("ci/qml-visual/environment.lock.json").read_text())
          actual = pathlib.Path("/opt/steamzero-visual/environment.txt").read_text()
          problems = [
              f"{label}: esperado {expected!r}"
              for label, expected in (
                  ("qml", lock["qt"]["runtimeVersion"]),
                  ("qmlSha256", lock["qt"]["qmlSha256"]),
                  ("qt6-declarative", lock["qt"]["qt6Declarative"]),
                  ("fontconfig", lock["textStack"]["fontconfig"]),
                  ("freetype2", lock["textStack"]["freetype2"]),
                  ("harfbuzz", lock["textStack"]["harfbuzz"]),
              )
              if expected not in actual
          ]
          if problems:
              print("QML-VISUAL-ENVIRONMENT-001: ambiente diverge de environment.lock.json")
              print("\n".join(problems))
              sys.exit(1)
          print("ambiente confere com o lock")
          CHECK
      - name: Dependências verificadas por hash
        # Container efêmero: instalar no python do sistema é seguro aqui, e o
        # Manjaro não traz `ensurepip` para criar venv.
        run: pip install --break-system-packages --require-hashes -r requirements-dev.lock
      - name: Gate visual
        run: pytest -m visual --tb=short -q
      - name: Publicar artefatos visuais
        # always(): em falha estes arquivos são a ÚNICA forma de descobrir o que
        # aconteceu numa máquina que não é a sua.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-visual-artifacts
          path: |
            /tmp/pytest-of-*/**/*.png
            /tmp/pytest-of-*/**/*.json
            /tmp/pytest-of-*/**/*.txt
          if-no-files-found: warn
          retention-days: 14
