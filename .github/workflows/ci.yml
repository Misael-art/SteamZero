# CI: roda os gates do DoD em todo PR (docs/08-testing/TEST-STRATEGY.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-verified lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Format check
        run: ruff format --check src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Boundary lint (MODULE-BOUNDARIES)
        run: python tools/lint_boundaries.py --root src
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests
        run: pytest --cov=steamzero --cov-report=term-missing

  # shellcheck roda quando houver shims bash (nenhum na Fase 1; gate pronto).
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (shims bash, se houver)
        run: |
          shopt -s globstar nullglob
          files=(shims/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "sem shims bash — ok"; exit 0; fi
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck "${files[@]}"
