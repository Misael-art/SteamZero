# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "steamzero"
dynamic = ["version"]
description = "SteamZero — plataforma transacional de jogos e emulação para Steam Deck e Linux (núcleo)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "SteamZero contributors" }]
dependencies = [
  "jsonschema>=4.21",
  "Pillow>=10.0",
]

[project.scripts]
steamzero = "steamzero.cli.main:main"
steamzero-gamemode-session = "steamzero.adapters.steam_session:main"
steamzero-gamemode-boot = "steamzero.adapters.steam_boot:main"
steamos-session-select = "steamzero.adapters.steam_session:select_main"
steamzero-launch = "steamzero.adapters.steam_launcher:main"
steamzero-core = "steamzero.service.core:main"
steamzero-host-prepare = "steamzero.adapters.host_preparation:main"
steamzero-admin = "steamzero.privileged.helper:main"

[tool.hatch.version]
path = "src/steamzero/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/steamzero"]
# Gerado pelo hook e gitignored; sem isto o hatchling o excluiria do wheel por
# respeitar o .gitignore, e o pacote instalado ficaria sem identidade.
artifacts = ["src/steamzero/_build_info.py"]

# Grava src/steamzero/_build_info.py com o commit de origem. Ver hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

# ---------------------------------------------------------------------------
# Ruff — lint + format. Enforces SR-02/SR-03 generically (S = flake8-bandit).
# Architecture-specific prohibitions live in tools/lint_boundaries.py.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
# S603/S607: subprocess use — allowed ONLY in core.proc/adapters, gated by the
# custom boundary lint. We keep S enabled globally and narrow via per-file-ignores.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]  # assert + segredo fake + subprocess de teste
"tools/**" = ["S603", "S607"]  # lint/CI helpers may invoke tools by design
"src/steamzero/i18n/messages_*.py" = ["E501"]  # catálogos de tradução: linhas longas ok

[tool.ruff.lint.isort]
known-first-party = ["steamzero"]

# ---------------------------------------------------------------------------
# mypy --strict on the core.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src/steamzero"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` entra no path para que fixtures compartilhados (tests/fixtures/*.py)
# sejam importáveis de tests/unit e tests/integration: por padrão o pytest só
# põe no sys.path o diretório do próprio arquivo, e cada suíte acabaria
# reescrevendo o mesmo fixture.
pythonpath = ["src", "tools", "tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast isolated unit tests",
  "integration: touch real filesystem/state",
  "fi: failure-injection tests (FAILURE-INJECTION.md)",
  "rt: rollback tests (ROLLBACK-TESTS.md)",
  "golden: contract golden-file tests",
  "security: security tests (SECURITY-TESTS.md, ST-*)",
  "slow: long-running",
  # Exigem runtime QML. NÃO são pulados: rodam no job `qml-visual-linux`, que
  # reprova quando o Qt falta. O marcador ROTEIA, não dispensa — o job `quality`
  # não provisiona Qt, e deixá-los lá faria a cobertura reprovar por ambiente em
  # vez de por código.
  "visual: require a QML runtime; run in the dedicated visual gate",
]

[tool.coverage.run]
source = ["steamzero"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 85
